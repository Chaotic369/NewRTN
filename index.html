<style>

*{box-sizing:border-box;margin:0}
body{font:16px/1.45 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none;background:var(--bg);color:var(--tx);padding-bottom:calc(80px + env(safe-area-inset-bottom))}

.row{display:flex;align-items:center;gap:10px;padding:10px 0}.row+.row{border-top:1px solid var(--bd)}
.g{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}.sub{font-size:14px;color:var(--tm)}.mu{color:var(--tm);text-decoration:line-through}.fl .mu{color:var(--er)}
.now{background:var(--s2);margin:0 -14px;padding:10px 14px}

.btn.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}.btn.d{color:var(--er)}
.ic{border:0;background:none;color:var(--tm);min-width:44px;min-height:44px;font-size:19px;border-radius:12px}.ic:hover{background:var(--s2)}

.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--ac) calc(var(--l,0)*100%),var(--s2))}

dialog{border:0;border-radius:18px 18px 0 0;background:var(--s);color:var(--tx);width:100%;max-width:520px;margin:auto auto 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media(min-width:600px){dialog{margin:auto;border-radius:18px}}
dialog label{display:block;font-size:13px;color:var(--tm);margin:12px 0 4px}dialog .ckl{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--tx)}

.dock .add input{border-radius:24px;min-height:48px}.dock .btn{border-radius:24px;min-width:72px;min-height:48px}
.dock .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 8px;padding:0 12px;scrollbar-width:none}.dock .chips::-webkit-scrollbar{display:none}
.dock .chip{flex:none;min-height:36px;padding:0 14px;font-size:14px;border-radius:18px}
body.kb nav{display:none}body.kb .dock{bottom:var(--kb,0px)}
dialog::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 14px}
dialog[open]{animation:up .22s ease}@keyframes up{from{transform:translateY(28px);opacity:0}}
dialog .btns .btn{flex:1}@media(max-width:599px){dialog{margin-bottom:var(--kb,0px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {getDatabase,ref,set,get} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
/* Firebase: same project, same record as the original app */
const firebaseConfig={apiKey:"AIzaSyD07C7OHAd4b4JSP9yPwx40pkCpd53yKrA",authDomain:"infinity-369.firebaseapp.com",projectId:"infinity-369",storageBucket:"infinity-369.firebasestorage.app",messagingSenderId:"1029653211647",appId:"1:1029653211647:web:4612a3e5f11b2739c01fca",databaseURL:"https://infinity-369-default-rtdb.firebaseio.com"};
const db=getDatabase(initializeApp(firebaseConfig)),PATH='operatives/raja_prime';

const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mins=t=>{const[a,b]=String(t).split(':').map(Number);return(a||0)*60+(b||0)};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],R=n=>(n<0?'-₹':'₹')+Math.abs(n);
const fd=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}),cap=s=>s?s[0]+s.slice(1).toLowerCase():'';
const mk=o=>({id:Date.now()+'',xp:25,duration:25,time:null,category:null,priority:'normal',repeat:null,completed:false,failed:false,completedAt:null,createdAt:Date.now(),notes:'',...o});

const TL=[['07:00','System start: wake up [DISCIPLINE]'],['07:10','Maintenance: bath / brush [HEALTH]'],['07:30','Fuel: breakfast [HEALTH]'],['08:00','Neural compile: deep work [LOGIC]'],['11:00','Cache clear: stretch [HEALTH]'],['11:10','Fuel: mid-day nutrition [HEALTH]'],['12:10','Deployment: college [LOGIC]'],['17:20','Return to base [DISCIPLINE]'],['17:30','Fuel recharge: eat food [HEALTH]'],['18:00','Neural compile: study / code [LOGIC]'],['20:00','Fuel: evening nutrition [HEALTH]'],['20:30','Neural compile: final study block [MEMORY]'],['21:30','Physical protocol: exercise [STRENGTH]'],['22:10','Decompression: shower [HEALTH]'],['23:00','Night maintenance [DISCIPLINE]'],['23:30','Screen lock: read / plan [FOCUS]'],['00:00','Power down: sleep [HEALTH]']];
const DEFAULT={profile:{username:'OPERATIVE',level:1,xp:0,rank:'SLAVE',avatarUrl:''},settings:{dailyXPGoal:500},tasks:[],budget:[],
timeline:TL.map(([time,label],i)=>({id:'t'+(i+1),time,label,color:'var(--blue)'})),workout_log:[],timeline_completed:{},timeline_completed_times:{},
exercises:[['Wall Push-Ups','CHEST',12],['Dead Bugs','CORE',10],['Glute Bridges','GLUTES',15],['Plank Hold','CORE',20,1],['Bodyweight Squats','LEGS',20]].map(([name,group,r,h],i)=>({id:'e'+(i+1),name,group,targetSets:3,targetReps:r,prSets:0,prReps:0,isHold:!!h})),
neural:{decks:[],subjects:[]},heatmap:{},global_streak:0,last_active_date:null,detox_streak:0,detox_last_checkin:null,taskSortMode:'time',taskFilter:'all',taskCatFilter:'',avoidance_log:[],fail_log:[],discipline_debt:0,debrief_log:[],morning_intentions:[],win_log:[],weekly_reviews:[],sleep_log:[]};

let S=clone(DEFAULT),synced=false,hist=[],tab='today',bTab='l',bm='m',tlOpen=false,dkT;
const arr=['tasks','budget','workout_log','exercises','timeline','win_log','morning_intentions','fail_log','avoidance_log','debrief_log','weekly_reviews','sleep_log'];
function fix(){const D=clone(DEFAULT);for(const k in D)if(S[k]==null)S[k]=D[k];S.profile={...D.profile,...S.profile};S.settings={...D.settings,...S.settings};
arr.forEach(k=>{if(!Array.isArray(S[k]))S[k]=Object.values(S[k]||{})});
for(const k in S.timeline_completed)if(!Array.isArray(S.timeline_completed[k]))S.timeline_completed[k]=Object.values(S.timeline_completed[k]||{});
S.timeline.sort((a,b)=>mins(a.time)-mins(b.time))}

/* Cloud sync: identical logic to the original (newest write wins) */
const dot=ok=>{$('sy').className='dot '+(ok?'ok':'off');$('sy').title=ok?'Synced':'Offline'};
function save(){if(!synced)return;S.lastUpdated=Date.now();set(ref(db,PATH),S).then(()=>dot(1)).catch(e=>{console.error('Firebase Sync Fail:',e);dot(0)})}
function sync(){get(ref(db,PATH)).then(s=>{synced=true;if(s.exists()){const c=s.val();if((c.lastUpdated||0)>=(S.lastUpdated||0)){S=c;fix();streaks();dot(1);render();toast('Synced')}else{save();toast('Local changes pushed')}}else{save();toast('New cloud record created')}}).catch(e=>{synced=true;console.error('Sync Error:',e);dot(0);toast('Offline: working locally')})}

const lvlNeed=l=>l>=100?50000:Math.floor(.4*l**3+2*l*l+100*l+300);
function lvl(x){let l=1,a=0;while(l<=100){const n=lvlNeed(l);if(a+n>x)return{l,prev:a,n};a+=n;l++}return{l:100,prev:a,n:50000}}
const rank=l=>l<5?'SLAVE':l<10?'OPERATIVE':l<15?'ANALYST':l<20?'STRATEGIST':l<30?'ARCHITECT':l<40?'SOVEREIGN':l<50?'GHOST':'QUANT';
function gain(n,src){if(!n)return;const b=lvl(S.profile.xp).l;S.profile.xp=Math.max(0,S.profile.xp+n);const a=lvl(S.profile.xp);S.profile.level=a.l;S.profile.rank=rank(a.l);const t=dk(new Date());S.heatmap[t]=Math.max(0,(S.heatmap[t]||0)+n);toast(`${n>0?'+':''}${n} XP · ${src}`);if(a.l>b)setTimeout(()=>toast(`Level ${a.l} · ${cap(rank(a.l))}`),1800)}
function streaks(){const t=dk(new Date()),T=new Date();T.setHours(0,0,0,0);
if(!S.last_active_date){S.last_active_date=t;S.global_streak=0}else if(S.last_active_date!==t){const L=new Date(S.last_active_date);L.setHours(0,0,0,0);const d=Math.round((T-L)/864e5);if(d===1)S.global_streak=(S.global_streak||0)+1;else if(d>1)S.global_streak=1;S.last_active_date=t}
if(S.detox_last_checkin!==t){if(S.detox_last_checkin){const y=new Date();y.setDate(y.getDate()-1);if(S.detox_last_checkin===dk(y)&&S.detox_last_tax_date!==t)S.detox_streak=(S.detox_streak||0)+1}S.detox_last_checkin=t}
save()}

let tt;function toast(m){const e=$('to');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
const H=()=>{hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()},commit=()=>{save();render()};

/* Tasks: same quick-add syntax as before */
function parse(raw){let t=raw,xp=25,time=null,category=null,priority='normal',repeat=null,m;
if(m=t.match(/(\d+)\s*xp/i)){xp=+m[1];t=t.replace(m[0],'')}
if(m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i)){let h=+m[1];const md=m[3].toLowerCase();if(h===12)h=md==='am'?0:12;else if(md==='pm')h+=12;time=String(h).padStart(2,'0')+':'+(m[2]||'00');t=t.replace(m[0],'')}
else if(m=t.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/)){time=m[0];t=t.replace(m[0],'')}
if(m=t.match(/#([A-Za-z]+)/)){category=m[1].toUpperCase();t=t.replace(m[0],'')}
if(/!critical/i.test(t)){priority='critical';t=t.replace(/!critical/i,'')}else if(/!high/i.test(t)){priority='high';t=t.replace(/!high/i,'')}
if(m=t.match(/repeat:(daily|weekly)/i)){repeat=m[1].toLowerCase();t=t.replace(m[0],'')}
const title=t.replace(/\s+/g,' ').trim();return title?mk({title,xp,time,category,priority,repeat}):null}

/* Budget: same shorthand as before */
const catMap={v:'Vegetable',vegetable:'Vegetable',fr:'Fruit',fruit:'Fruit',f:'Fruit',m:'Milk',milk:'Milk',g:'Gas',gas:'Gas',ff:'Fast food','fast food':'Fast food',r:'Food ration','food ration':'Food ration',gt:'Given to','given to':'Given to',tf:'Taken from','taken from':'Taken from'};
function bal(){let t=0,o=0,c=0;S.budget.forEach(b=>{const v=b.category.toLowerCase()==='taken from'?b.amount:-b.amount;t+=v;b.mode==='Cash'?c+=v:o+=v});return{t,o,c}}
function ana(mode){const now=new Date(),g={};S.budget.filter(b=>b.category.toLowerCase()!=='taken from').forEach(b=>{const d=new Date(b.date);if((now-d)/864e5>(mode==='d'?30:183))return;const k=mode==='d'?dk(d):d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),o=g[k]=g[k]||{};o[b.category]=(o[b.category]||0)+b.amount});
return Object.keys(g).sort().reverse().map(k=>{const c=g[k],t=Object.values(c).reduce((a,b)=>a+b,0);return `<section class="card"><div class="row" style="padding-top:0"><b class="g">${k}</b><b class="neg">-₹${t}</b></div>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="sub" style="display:flex;justify-content:space-between"><span>${esc(n)}</span><span>₹${v} · ${Math.round(v/t*100)}%</span></div><div class="pb"><i style="width:${Math.round(v/t*100)}%"></i></div>`).join('')}</section>`}).join('')||'<p class="sub">No spending in this range yet.</p>'}

function pstreak(){const s=new Set(S.workout_log.map(w=>dk(new Date(w.date))));const d=new Date();let c=0;if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){c++;d.setDate(d.getDate()-1)}return c}
function heat(){const g=S.settings.dailyXPGoal||500,n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-(77+n.getDay()));let h='';for(let i=0;i<84;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);if(d>n){h+='<i></i>';continue}const v=S.heatmap[dk(d)]||0;h+=`<i style="--l:${v>0?Math.max(.18,Math.min(1,v/g)).toFixed(2):0}" title="${dk(d)}: ${v} XP"></i>`}return `<div class="heat">${h}</div>`}

/* Screens */
const V={
today(){const t=dk(new Date()),n=new Date(),nm=n.getHours()*60+n.getMinutes(),a=S.activeTask,P={critical:0,high:1,normal:2};
const pend=S.tasks.filter(x=>!x.completed&&!x.failed).sort((x,y)=>(x.time?mins(x.time):1e4)-(y.time?mins(y.time):1e4)||(P[x.priority]??2)-(P[y.priority]??2)),fin=S.tasks.filter(x=>x.completed||x.failed);
const mi=S.morning_intentions.find(m=>m.date===t),wins=S.win_log.filter(w=>dk(new Date(w.timestamp))===t),dl=S.timeline_completed[t]||[];let cur=-1;S.timeline.forEach((x,i)=>{if(mins(x.time)<=nm)cur=i});
let act='';if(a){const s=a.isTimeline?S.timeline.find(x=>x.id===a.id):S.tasks.find(x=>x.id===a.id);act=`<section class="card act"><h2>In progress</h2><div class="big" id="tm">…</div><p>${esc(s?(s.title||s.label):'Task')}</p><div class="btns" style="justify-content:flex-start"><button class="btn p" data-a="adone">Done</button><button class="btn" data-a="amin">+1 min</button><button class="btn" data-a="askip">Skip</button><button class="btn d" data-a="afail">Fail</button></div></section>`}
const row=x=>`<div class="row${x.failed?' fl':''}"><button class="ck${x.completed?' on':''}" data-a="done" data-i="${esc(x.id)}" aria-label="Complete">${x.completed?'✓':''}</button><div class="g" data-a="task" data-i="${esc(x.id)}"><div class="${x.completed||x.failed?'mu':''}">${esc(x.title)}</div><div class="sub">${esc([x.time,x.category,x.priority!=='normal'?x.priority:'',x.repeat,x.failed?'failed':''].filter(Boolean).join(' · '))}</div></div><span class="chip">${x.xp} XP</span>${x.completed||x.failed?'':`<button class="ic" data-a="start" data-i="${esc(x.id)}" aria-label="Start">▶</button>`}</div>`;
return act+`<section class="card"><h2>Tasks</h2>${pend.map(row).join('')||'<p class="sub">Nothing pending. Type below to add one, e.g. “Study 8pm #logic !high 40xp”.</p>'}</section>`
+(fin.length?`<section class="card"><h2>Finished <button class="lnk" data-a="clear">Clear all</button></h2>${fin.map(row).join('')}</section>`:'')

+`<section class="card"><h2>Wins</h2><div class="add"><input id="wi" placeholder="Log a win (+5 XP)" data-enter="win" autocomplete="off"><button class="btn" data-a="win">Log</button></div>${wins.slice(-5).reverse().map(w=>`<div style="margin-top:8px">${esc(w.text)}</div>`).join('')}</section>`
+`<section class="card"><div class="row" style="padding:0"><div class="g" style="cursor:default"><div>Slipped on short-form content?</div><div class="sub">Costs 50 XP and resets your detox streak</div></div><button class="btn" data-a="tax">Pay the tax</button></div></section>`},

train(){return `<section class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><b>${S.workout_log.length}</b><span>Sessions</span></div><div class="tile"><b>${pstreak()}</b><span>Day streak</span></div></section>`
+`<section class="card"><h2>Exercises <button class="lnk" data-a="ex">Add</button></h2>${S.exercises.map(e=>`<div class="row"><div class="g" data-a="ex" data-i="${esc(e.id)}"><div>${esc(e.name)}</div><div class="sub">${esc(e.group||'')} · ${e.targetSets}×${e.targetReps}${e.isHold?' s':''}${e.prSets?` · best ${e.prSets}×${e.prReps}`:''}</div></div><button class="btn" data-a="log" data-i="${esc(e.id)}">Log</button></div>`).join('')||'<p class="sub">No exercises yet. Add one to start tracking.</p>'}</section>`
+`<section class="card"><h2>Recent sessions</h2>${S.workout_log.slice(-8).reverse().map(w=>`<div class="row"><div class="g" style="cursor:default">${esc(w.exerciseName)}<div class="sub">${fd(w.date)}${w.notes?' · '+esc(w.notes):''}</div></div><span class="chip">${w.sets}×${w.reps}${w.duration?' · '+w.duration+' min':''}</span></div>`).join('')||'<p class="sub">Log your first session to see it here.</p>'}</section>`},

budget(){const b=bal(),now=new Date(),mo=S.budget.filter(x=>{const d=new Date(x.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).reverse();let last='',L='';
mo.forEach(x=>{const d=new Date(x.date),g=d.getDate()+' '+MN[d.getMonth()],inc=x.category.toLowerCase()==='taken from';if(g!==last){L+=`<div class="sub grp">${g}</div>`;last=g}L+=`<div class="row"><div class="g" data-a="bitem" data-i="${esc(x.id)}"><div>${esc(x.item||x.person||x.category)}</div><div class="sub">${esc(x.category)}${x.person&&x.item?' · '+esc(x.person):''} · ${esc(x.mode)}</div></div><b class="${inc?'pos':'neg'}">${inc?'+':'-'}₹${x.amount}</b></div>`});

stats(){const p=S.profile,l=lvl(p.xp),g=S.settings.dailyXPGoal||500,td=S.heatmap[dk(new Date())]||0,tot=S.tasks.length,dn=S.tasks.filter(x=>x.completed).length,w=p.currentWeight||'',wp=w?Math.min(100,Math.max(0,(w-45)/10*100)):0;
return `<section class="card"><div class="row" style="padding-top:0"><div class="av">${p.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:esc((p.username||'OP').slice(0,2))}</div><div class="g" style="cursor:default"><b>${esc(p.username)}</b><div class="sub">Level ${l.l} · ${cap(rank(l.l))}</div></div><button class="btn" data-a="prof">Settings</button></div><div class="pb"><i style="width:${Math.min(100,(p.xp-l.prev)/l.n*100)}%"></i></div><div class="sub">${p.xp-l.prev} of ${l.n} XP to the next level</div><input value="${esc(p.mission||'')}" placeholder="Your mission" data-ch="mission" style="margin-top:12px"></section>`

+`<section class="card"><h2>Activity · last 12 weeks</h2>${heat()}</section>`
+`<section class="card"><h2>Weight target</h2><div class="add"><input type="number" step="0.1" value="${w}" placeholder="Current kg" data-ch="weight"><span class="chip" style="align-self:center">of 55 kg</span></div><div class="pb" style="margin-top:10px"><i style="width:${wp}%"></i></div></section>`}
};

const DK={today:()=>`<div class="add"><input id="ti" placeholder="Add a task…" data-enter="addtask" enterkeyhint="send" autocomplete="off"><button class="btn p" data-a="addtask">Add</button></div>`,

function render(){const l=lvl(S.profile.xp);$('lv').textContent=`Lv ${l.l} · ${S.profile.xp}`;$('xb').style.width=Math.min(100,(S.profile.xp-l.prev)/l.n*100)+'%';$('v').innerHTML=V[tab]();if(dkT!==tab){dkT=tab;$('dk').innerHTML=DK[tab]?DK[tab]():'';$('dk').hidden=!DK[tab];document.body.classList.toggle('dk',!!DK[tab])}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}

/* Sheets */
const lab=(t,h)=>`<label>${t}</label>${h}`,inp=(id,v='',x='')=>`<input id="${id}" value="${esc(v)}" ${x}>`,close=()=>$('sh').close();
function sheet(title,body,save,id,del,lbl='Save'){const d=$('sh');d.innerHTML=`<h3>${title}</h3>${body}<div class="btns"><button class="btn" data-a="close">Cancel</button>${del?`<button class="btn d" data-a="${del}" data-i="${esc(id)}">Delete</button>`:''}${save?`<button class="btn p" data-a="${save}" data-i="${esc(id||'')}">${lbl}</button>`:''}</div>`;if(!d.open)d.showModal()}

const A={
close,
theme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('sp_theme',n)}catch(e){}tc()},
undo(){if(!hist.length)return toast('Nothing to undo');S=JSON.parse(hist.pop());fix();commit();toast('Undone')},
sync(){close();toast('Syncing…');sync()},
addtask(){const t=parse($('ti').value);if(!t)return;H();S.tasks.push(t);$('ti').value='';commit()},
done(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;H();
if(t.failed){t.failed=false;t.completedAt=null;return commit()}
if(t.completed){if(t._xpAwarded)gain(-t._xpAwarded,'Task reopened');t.completed=false;t.completedAt=null;t._xpAwarded=0;return commit()}
t.completed=true;t.completedAt=Date.now();if(S.activeTask&&!S.activeTask.isTimeline&&S.activeTask.id===id)S.activeTask=null;
let n=t.xp;if(t.time){const d=new Date();if(d.getHours()*60+d.getMinutes()>mins(t.time))n=Math.floor(n*.6)}
t._xpAwarded=n;gain(n,t.title);
if(t.repeat==='daily'&&!t._repeated){t._repeated=true;S.tasks.push({...t,id:Date.now()+'',completed:false,failed:false,completedAt:null,_xpAwarded:0,_repeated:false,createdAt:Date.now()})}commit()},
deltask(id){close();H();if(S.activeTask&&S.activeTask.id===id)S.activeTask=null;S.tasks=S.tasks.filter(x=>x.id!==id);commit()},

task(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;sheet('Task',`<p style="margin:8px 0 4px">${esc(t.title)}</p><p class="sub">${esc([t.time,t.category,t.priority!=='normal'?t.priority:'',t.repeat,t.xp+' XP'].filter(Boolean).join(' · '))}</p>`,t.completed||t.failed?'':'start',id,'deltask','Start timer')},
bitem(id){const b=S.budget.find(x=>x.id===id);if(!b)return;sheet(R(b.amount),`<p style="margin:8px 0 4px">${esc(b.item||b.person||b.category)}</p><p class="sub">${esc(b.category)} · ${esc(b.mode)} · ${fd(b.date)}</p>`,'',id,'delb')},

adone(){const a=S.activeTask;if(!a)return;H();if(a.isTimeline){const t=dk(new Date()),l=S.timeline_completed[t]=S.timeline_completed[t]||[];if(!l.includes(a.id)){l.push(a.id);gain(15,'Protocol done')}S.activeTask=null;return commit()}S.activeTask=null;A.done(a.id)},

tl(id){const t=dk(new Date());H();const l=S.timeline_completed[t]=S.timeline_completed[t]||[],i=l.indexOf(id);if(i>=0){l.splice(i,1);gain(-15,'Block reopened')}else{l.push(id);(S.timeline_completed_times[t]=S.timeline_completed_times[t]||{})[id]=Date.now();gain(15,'Block done')}commit()},
tledit(id){const x=S.timeline.find(y=>y.id===id)||{};sheet(x.id?'Edit block':'New block',lab('Time',inp('f1',x.time||'','type="time"'))+lab('Label',inp('f2',x.label||'')),'tlsave',x.id,x.id&&'tldel')},

intent(){const m=S.morning_intentions.find(x=>x.date===dk(new Date()))||{};sheet('Today’s priorities',lab('Priority 1',inp('f1',m.p1))+lab('Priority 2',inp('f2',m.p2))+lab('Priority 3',inp('f3',m.p3))+lab('Must not fail (copy one from above)',inp('f4',m.critical)),'intentsave')},
intentsave(){const p1=$('f1').value.trim(),p2=$('f2').value.trim(),p3=$('f3').value.trim(),critical=$('f4').value.trim();if(!p1&&!p2&&!p3)return close();H();const t=dk(new Date()),i=S.morning_intentions.findIndex(x=>x.date===t),e={date:t,p1,p2,p3,critical,timestamp:Date.now()};if(i>=0)S.morning_intentions[i]=e;else{S.morning_intentions.push(e);gain(5,'Priorities set')}close();commit()},
win(){const t=$('wi').value.trim();if(!t)return;H();S.win_log.push({text:t,timestamp:Date.now()});gain(5,'Win logged');commit()},
tax(){if(!confirm('Pay the dopamine tax? It costs 50 XP and resets your detox streak.'))return;H();gain(-50,'Dopamine tax');S.detox_streak=0;S.detox_last_tax_date=dk(new Date());S.tasks.push(mk({title:'Tax: 40 push-ups or 20 min in a blank editor',xp:0,category:'DISCIPLINE',priority:'critical'}));commit()},

ex(id){const e=S.exercises.find(x=>x.id===id)||{};sheet(e.id?'Edit exercise':'New exercise',lab('Name',inp('f1',e.name))+lab('Muscle group',inp('f2',e.group))+`<div class="two"><div>${lab('Target sets',inp('f3',e.targetSets||3,'type="number"'))}</div><div>${lab('Reps or seconds',inp('f4',e.targetReps||10,'type="number"'))}</div></div><label class="ckl"><input id="f5" type="checkbox"${e.isHold?' checked':''}> Timed hold (seconds)</label>`,'exsave',e.id,e.id&&'exdel')},
exsave(id){const name=$('f1').value.trim();if(!name)return toast('Add a name');H();const o={name,group:$('f2').value.trim().toUpperCase(),targetSets:+$('f3').value||3,targetReps:+$('f4').value||10,isHold:$('f5').checked};if(id)Object.assign(S.exercises.find(x=>x.id===id),o);else S.exercises.push({id:'e'+Date.now(),prSets:0,prReps:0,...o});close();commit()},
exdel(id){H();S.exercises=S.exercises.filter(x=>x.id!==id);close();commit()},
log(id){sheet('Log session',lab('Exercise',`<select id="f1">${S.exercises.map(e=>`<option value="${esc(e.id)}"${e.id===id?' selected':''}>${esc(e.name)}</option>`).join('')}</select>`)+`<div class="two"><div>${lab('Sets',inp('f2','','type="number" min="1"'))}</div><div>${lab('Reps',inp('f3','','type="number" min="1"'))}</div></div>`+lab('Duration (min, optional)',inp('f4','','type="number" min="0"'))+lab('Notes',inp('f5')),'logsave')},
logsave(){const ex=S.exercises.find(x=>x.id===$('f1').value),sets=parseInt($('f2').value),reps=parseInt($('f3').value),duration=parseInt($('f4').value)||0;if(!ex||!sets||!reps)return toast('Enter sets and reps');H();
S.workout_log.push({date:Date.now(),exerciseId:ex.id,exerciseName:ex.name,sets,reps,duration,notes:$('f5').value.trim()});let xp=100+(duration>0?Math.min(30,duration*2):0);const lt=sets*reps;
if(lt>=ex.targetSets*ex.targetReps){ex.targetReps+=ex.isHold?5:1;xp+=50;toast('Progressive overload achieved')}
if(lt>(ex.prSets||0)*(ex.prReps||0)){ex.prSets=sets;ex.prReps=reps;xp+=50}gain(xp,'Session logged');close();commit()},
bud(){const s=$('bi').value.trim();if(!s)return toast('Enter an amount and item');let amount=0,mode='Online',category='Miscellaneous',person='',item='';const rest=[];
s.split(/\s+/).forEach(p=>{const n=parseFloat(p);if(!isNaN(n))amount=n;else if(p.toLowerCase()==='cash')mode='Cash';else if(p.toLowerCase()==='online')mode='Online';else rest.push(p)});
const ci=rest.findIndex(p=>catMap[p.toLowerCase()]);
if(ci>-1){category=catMap[rest[ci].toLowerCase()];const o=rest.filter((_,i)=>i!==ci).join(' ');if(category==='Given to'||category==='Taken from')person=o||'Unknown';else item=o}else if(rest.length)category=rest.join(' ');
if(amount<=0)return toast('Enter a valid amount');H();S.budget.push({id:'b_'+Date.now(),date:Date.now(),category,amount,mode,person,item});$('bi').value='';commit();toast(`Recorded ${category} ${R(amount)} (${mode})`)},
cat(c){const i=$('bi'),keys=Object.keys(catMap),p=i.value.trim().split(/\s+/).filter(Boolean).filter(x=>!keys.includes(x.toLowerCase()));p.push(c);i.value=p.join(' ');i.focus()},
delb(id){close();H();S.budget=S.budget.filter(b=>b.id!==id);commit()},
bt(k){bTab=k;render()},bm(k){bm=k;render()},

};
const C={mission(v){S.profile.mission=v.trim();save();toast('Mission saved')},weight(v){const n=parseFloat(v);if(n>0){S.profile.currentWeight=n;commit()}}};

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter)A[e.target.dataset.enter]()});

$('v').addEventListener('toggle',e=>{if(e.target.id==='tld')tlOpen=e.target.open},true);
setInterval(()=>{const a=S.activeTask,e=$('tm');if(!a||!e)return;const s=(a.expectedDuration+a.addedMins)*60-(Date.now()-a.startTime)/1000,m=Math.abs(s);e.textContent=(s<0?'+':'')+Math.floor(m/60)+':'+String(Math.floor(m%60)).padStart(2,'0');e.style.color=s<0?'var(--er)':''},1000);

if(window.visualViewport){const f=()=>document.documentElement.style.setProperty('--kb',Math.max(0,innerHeight-visualViewport.height-visualViewport.offsetTop)+'px');visualViewport.addEventListener('resize',f);visualViewport.addEventListener('scroll',f)}
